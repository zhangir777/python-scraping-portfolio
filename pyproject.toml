[project]
name = "python-scraping-portfolio"
version = "1.0.0"
description = "Web scraping portfolio: static and JS sites to formatted Excel/CSV/JSON, price monitoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "selectolax>=1.0",
    "playwright>=1.64",
    "pydantic>=2.14",
    "openpyxl>=3.1",
    "typer>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
scrape-books = "projects.static_catalog.scraper:app"
scrape-quotes = "projects.js_dynamic.scraper:app"
price-monitor = "projects.price_monitor.monitor:app"
inventory-tracker = "projects.inventory_tracker.tracker:app"
bulk-prices = "projects.bulk_urls.run:app"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "projects"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option in defaults is the Typer idiom

[tool.pytest.ini_options]
testpaths = ["tests", "template"]
